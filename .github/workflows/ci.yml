name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Gated on the Playwright harness: every step no-ops until a
    # playwright.config.* lands in the repo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: harness
        run: |
          if ls playwright.config.* >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "No Playwright config yet — skipping E2E."; fi
      - if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.harness.outputs.present == 'true'
        run: npm ci
      - if: steps.harness.outputs.present == 'true'
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - if: steps.harness.outputs.present == 'true'
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - if: steps.harness.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - if: steps.harness.outputs.present == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - if: steps.harness.outputs.present == 'true'
        run: npx playwright test
      - if: failure() && steps.harness.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
